# Kdenlive Headless Render Stack for Coolify
# 
# This docker-compose file deploys a headless video rendering service
# using Kdenlive's MLT backend with a FastAPI-based control API.
#
# IMPORTANT: This service is COMPLETELY SEPARATE from the trading dashboard
# and uses no reserved URLs. Access is internal only via Coolify networks.
#
# Project UUID (in Coolify): Create a new "Kdenlive Media" project
# Internal URL for Hermes: http://kdenlive-headless:8080

version: '3.8'

services:
  kdenlive-headless:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kdenlive-headless
    image: localhost:3200/kdenlive-headless:latest
    environment:
      - KDENLIVE_API_KEY=${KDENLIVE_API_KEY}
      - TZ=Asia/Kolkata
    volumes:
      - /opt/data/kdenlive-workspace:/workspace
    ports:
      - "8080"
    restart: unless-stopped
    networks:
      - hermesnet
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  hermesnet:
    name: gw5navcuqga1qhxypunyvhya
    external: true