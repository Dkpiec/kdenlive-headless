# Kdenlive Headless Render Stack for Coolify
# Built from Git (github.com/Dkpiec/kdenlive-headless) on the Coolify host.
# Fully internal: no public URL, no reserved ngrok endpoint.
# Hermes reaches it at: http://kdenlive-headless:8080

services:
  kdenlive-headless:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kdenlive-headless
    environment:
      - KDENLIVE_API_KEY=${KDENLIVE_API_KEY}
      - TZ=Asia/Kolkata
      - WORKSPACE_PATH=/workspace
    volumes:
      - kdenlive_workspace:/workspace
    restart: unless-stopped
    networks:
      - hermesnet
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

volumes:
  kdenlive_workspace:

networks:
  hermesnet:
    name: gw5navcuqga1qhxypunyvhya
    external: true
